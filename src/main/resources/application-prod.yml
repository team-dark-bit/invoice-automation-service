spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:3600000}

billing:
  provider: ${BILLING_PROVIDER}

recipient:
  lookup-provider: ${RECIPIENT_LOOKUP_PROVIDER:mock}

logging:
  level:
    root: INFO
    com.invoiceautomationservice: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
