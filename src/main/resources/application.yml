spring:
  application:
    name: invoice-automation-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invoice_automation_service}
    username: ${DB_USER:invoice_user}
    password: ${DB_PASSWORD:invoice_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: ${IMAGE_MULTIPART_MAX_SIZE:10MB}
      max-request-size: ${IMAGE_MULTIPART_MAX_REQUEST_SIZE:11MB}
server:
  shutdown: graceful
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true
info:
  app:
    name: ${spring.application.name}
    description: Conversational invoicing SaaS
    version: "@project.version@"
jwt:
  secret: ${JWT_SECRET:local-development-jwt-secret-change-me}
  expiration: ${JWT_EXPIRATION_MS:259200000}
logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
billing:
  provider: ${BILLING_PROVIDER:mock}
recipient:
  lookup-provider: ${RECIPIENT_LOOKUP_PROVIDER:mock}
ai:
  provider: ${AI_PROVIDER:rules}
  model: ${AI_MODEL:rules}
image-storage:
  provider: ${IMAGE_STORAGE_PROVIDER:local}
  root: ${IMAGE_STORAGE_ROOT:./data/images}
  max-size-bytes: ${IMAGE_MAX_SIZE_BYTES:10485760}
  max-width: ${IMAGE_MAX_WIDTH:12000}
  max-height: ${IMAGE_MAX_HEIGHT:12000}
  default-retention-days: ${IMAGE_DEFAULT_RETENTION_DAYS:30}
  max-retention-days: ${IMAGE_MAX_RETENTION_DAYS:3650}
  cleanup-cron: ${IMAGE_CLEANUP_CRON:0 0 3 * * *}
