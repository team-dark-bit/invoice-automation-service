spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:3600000}

billing:
  provider: ${BILLING_PROVIDER}

recipient:
  lookup-provider: ${RECIPIENT_LOOKUP_PROVIDER:mock}

ai:
  provider: ${AI_PROVIDER:mock}
  model: ${AI_MODEL:claude-sonnet-5-5}
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  max-tokens: ${AI_MAX_TOKENS:2048}
  connect-timeout: ${AI_CONNECT_TIMEOUT:10s}
  read-timeout: ${AI_READ_TIMEOUT:90s}
  review-threshold: ${AI_REVIEW_THRESHOLD:0.80}

image-storage:
  provider: ${IMAGE_STORAGE_PROVIDER:local}
  root: ${IMAGE_STORAGE_ROOT:/app/data/images}

logging:
  level:
    root: INFO
    com.invoiceautomationservice: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
